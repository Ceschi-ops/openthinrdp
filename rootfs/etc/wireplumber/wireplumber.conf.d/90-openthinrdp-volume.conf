# Output and microphone at the full level of the device (0 dB, no amplification). The WirePlumber default is
# 0.4 on a cubic scale (-24 dB) and the thin client has no volume control: with Windows at maximum it was very
# quiet. The volume is set in Windows.
wireplumber.settings = {
  device.routes.default-sink-volume = 1.0
  device.routes.default-source-volume = 1.0
}
