# The FreeRDP that OpenThinRDP ships (FREERDP_FROM=openthinrdp): FreeRDP with the UDP transport (RDPEUDP),
# built from this exact commit and packaged like Debian's trixie-backports freerdp3.
#
# Branch openthinrdp-udp-3.32.2-pr-net of the fork = FreeRDP 3.32.2 (security release of 2026-10-12, which already
# contains our USB fixes #13674 and #13679, and #13618)
#   + pull request #13608 (UDP transport, by Espen Tveit, approved by a FreeRDP maintainer): its 39 commits,
#     applied unchanged. Two of them came from our tests: ten SYN attempts, and the fix for the false
#     "stream is stuck" on lossy lines (Reported-by: Ceschi-ops)
#   + pull request #13748 (ours): /network is applied before the other options, so /network:auto no longer turns
#     on the H.264 codecs that RDP_GFX turned off (issue #13747)
# Every change is a commit with its own description: git log 3.32.2..openthinrdp-udp-3.32.2-pr-net
# When the UDP transport lands in a FreeRDP release, OpenThinRDP goes back to Debian's packages.
FREERDP_REPO=https://github.com/Ceschi-ops/FreeRDP.git
FREERDP_COMMIT=1529245ac60a05507efbe19e3b6777888706271d
# Debian version of the packages: <base>.<commit date and time>.<short commit>+otr<n>. The base stays above every
# Debian 3.32.x and above our earlier builds, so devices always take a newer build and a backports package never
# replaces it by accident.
FREERDP_VERSION_BASE=3.33.0~udp
FREERDP_OTR_REVISION=1
# Prebuilt packages of this commit: one archive attached to a release of the OpenThinRDP repository. build.sh
# downloads it and checks it against SHA256SUMS next to this file; without that file it builds them (build-debs.sh).
FREERDP_RELEASE_URL=https://github.com/OpenThinRdp/openthinrdp/releases/download/freerdp-1529245ac
