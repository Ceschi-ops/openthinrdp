# The FreeRDP that OpenThinRDP ships (FREERDP_FROM=openthinrdp): FreeRDP with the UDP transport (RDPEUDP),
# built from this exact commit and packaged like Debian's trixie-backports freerdp3.
#
# Branch openthinrdp-udp-13679 of the fork = FreeRDP master
#   + pull request #13608 (UDP transport, by Espen Tveit, under review)
#   + pull request #13674 (urbdrc: deadlock between USB hotplug and channel close)
#   + pull request #13679 (urbdrc: free the devices before stopping the event thread, no hang on disconnect;
#     by akallabeth from our #13677)
#   + pull request #13618 (urbdrc: no real device reset, cancelled transfers complete; merged in master on
#     2026-10-08, newer than the base of #13608)
# Every change is a commit with its own description: git log 35baef27a..openthinrdp-udp-13679
# When these land in a FreeRDP release, OpenThinRDP goes back to Debian's packages.
FREERDP_REPO=https://github.com/Ceschi-ops/FreeRDP.git
FREERDP_COMMIT=e279c9744b8c8fc62844ccdc68cd11d3e0736798
# Debian version of the packages: <base>.<commit date>.<short commit>+otr<n>. Above Debian's 3.32.x, so a
# backports package never replaces it by accident.
FREERDP_VERSION_BASE=3.33.0~udp
FREERDP_OTR_REVISION=1
# Prebuilt packages of this commit: one archive attached to a release of the OpenThinRDP repository. build.sh
# downloads it and checks it against SHA256SUMS next to this file; without that file it builds them (build-debs.sh).
FREERDP_RELEASE_URL=https://github.com/Ceschi-ops/openthinrdp/releases/download/freerdp-e279c9744
