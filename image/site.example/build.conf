# OpenThinRDP image build options. Copy the whole site.example folder to image/site and edit it.

# Installer and system language, time zone, keyboard (X11 layout: us, it, de, fr, ...)
LOCALE=en_US.UTF-8
TIMEZONE=Etc/UTC
KEYBOARD=us
# Password of the "otradmin" account for the local console (tty2), as a hash: mkpasswd -m yescrypt
# Empty = no console password (otradmin can log in only over SSH with a key, see SSH in site.conf).
ADMIN_PASSWORD_HASH=
# FreeRDP: backports = Debian trixie-backports (recommended, newer USB and graphics fixes)
#          debian    = Debian trixie
#          site      = only the .deb files in debs/ (your own build, e.g. with WITH_RDPEUDP=ON)
FREERDP_FROM=backports
# The installer wipes the FIRST disk without asking anything: yes. no = the usual Debian questions.
AUTO_INSTALL=yes
# Chromium for the web button (WEB_BUTTON): yes or no (no = about 380 MB less, no web button)
INCLUDE_BROWSER=yes
# Firmware packages besides the default set (Intel/AMD graphics, Intel audio, Realtek, Intel Wi-Fi), space
# separated, e.g. firmware-atheros firmware-mediatek firmware-brcm80211 firmware-bnx2
EXTRA_FIRMWARE=
# Chromium: kiosk page and web button (WEB_BUTTON=kiosk/app/browser). yes (default) or no: without it about
# 380 MB less, and only the remote desktop is available.
INCLUDE_BROWSER=yes
# Firmware besides the default set (Intel/AMD graphics, Intel audio, Realtek network, Intel Wi-Fi), space
# separated, e.g. firmware-atheros firmware-mediatek firmware-brcm80211
EXTRA_FIRMWARE=
