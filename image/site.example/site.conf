# Settings of your organization, built into the image as /etc/openthinrdp/site.conf.
# Any key of /opt/openthinrdp/defaults.conf (docs/configuration.md); the device settings override them.
# The downloadable ISO is built with this file as it is: no broker, so every device opens its settings
# dialog at the first start. In your own image, set your broker here and the devices start ready to use.
#BROKER=rdbroker.example.com
#DOMAIN=EXAMPLE
#LOAD_BALANCE_INFO=tsv://VMResource.1.MY_COLLECTION
#MGMT_SHARE=\\fileserver\thinclients
LANGUAGE=en
KEYBOARD=us
TITLE=Remote desktop
