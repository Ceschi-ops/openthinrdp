source /boot/grub/config.cfg

# OpenThinRDP boot menu (over live-build's template). The live system is the default and starts by itself after
# the countdown: it never writes to the disk. The installer is never the default: it wipes the first internal disk.
menuentry "Try OpenThinRDP (live, the disk is not touched)" --hotkey=t {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@
	initrd	@INITRD_LIVE@
}

if @ENABLE_INSTALL_MENU@; then
	source	/boot/grub/install_start.cfg
fi

if [ "${grub_platform}" = "efi" ]; then
	menuentry "UEFI firmware settings" --hotkey=f {
		fwsetup
	}
fi
